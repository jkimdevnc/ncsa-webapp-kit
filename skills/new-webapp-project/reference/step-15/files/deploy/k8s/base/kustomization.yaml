# The app on any Kubernetes cluster: redis, api (2 replicas) and web. No namespace, no image source and no way in
# from outside the cluster; each overlay adds those (overlays/local for OrbStack, NCSA's in Step 16).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: mosaic
resources:
  - redis.yaml
  - api.yaml
  - web.yaml
