# Runs the same checks as the Mac on every PR into develop or main and on every push to them:
# - `ci`: `make lint` + `make test`;
# - `stack`: the full stack in containers, with the E2E suite against it.
# GitHub Free has no branch protection for private repos, so a red check here means "do not merge".
name: ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      # The same image as docker-compose.yml; the integration tests use it on localhost:6379.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag, so it is pinned to a release.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The frontend's packages: the eslint and prettier hooks and the Vitest tests use them.
      - name: Install frontend packages
        run: npm ci
        working-directory: frontend
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      # The E2E report and traces, to see what the browser saw when a test failed.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # The full stack in containers (docker-compose.yml), built on GitHub's amd64 runners, with the E2E suite run
  # against it, including the Redis restart test. The same as `make up` + `make test-e2e-local-stack` on the Mac.
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend packages
        run: npm ci
        working-directory: frontend
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build and start the stack
        run: make up
      - name: E2E against the stack
        run: make test-e2e-local-stack
      - name: Stack logs
        if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-stack
          path: frontend/playwright-report/
          retention-days: 7
