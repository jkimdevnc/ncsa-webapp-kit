# Builds the api and web images for linux/amd64 (the NCSA cluster) and linux/arm64 (the Mac, OrbStack's k8s), pushes
# them to GHCR, then smoke-tests the amd64 images. It runs on pull requests too, so a PR's images can be inspected
# before merging, and a red `smoke` check means "do not merge", like `ci` and `stack`.
#
# Tags: `sha-<7-char commit>` on every run (the PR's head commit on pull requests), plus `develop` or `main` when that
# branch is pushed. The packages are private like the repo: the source label links them to it.
name: images

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/jkimdevnc
  # The commit that is built: the PR's head on pull requests (not GitHub's temporary merge commit).
  COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - { name: mosaic-api, context: backend }
          - { name: mosaic-web, context: frontend }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT }}
      - name: Tags
        id: tags
        run: |
          tags="$REGISTRY/${{ matrix.image.name }}:sha-${COMMIT::7}"
          if [ "${{ github.event_name }}" = push ]; then
            tags="$tags,$REGISTRY/${{ matrix.image.name }}:${{ github.ref_name }}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      # GitHub's free runners are amd64; arm64 is built under emulation.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  # The amd64 images just pushed, started with Redis on one network the way Compose and Kubernetes run them.
  smoke:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start redis, api and web
        run: |
          tag="sha-${COMMIT::7}"
          docker network create mosaic
          docker run -d --name redis --network mosaic redis:7-alpine
          docker run -d --name api --network mosaic --platform linux/amd64 --read-only --tmpfs /tmp \
            -e REDIS_URL=redis://redis:6379/0 -p 127.0.0.1:8000:8000 "$REGISTRY/mosaic-api:$tag"
          docker run -d --name web --network mosaic --platform linux/amd64 -p 127.0.0.1:8080:8080 \
            "$REGISTRY/mosaic-web:$tag"
      - name: The API is ready
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/readyz; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Web serves the app and passes /api to the API
        run: |
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/api/v1/readyz | grep -q '"status":"ready"'
      - name: Container logs
        if: failure()
        run: docker logs api; docker logs web
