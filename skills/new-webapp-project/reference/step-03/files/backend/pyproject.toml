[project]
name = "mosaic-backend"
version = "0.1.0"
description = "MOSAIC prototype API"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.1",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs the real Redis from docker compose (make test-fast skips these)"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
